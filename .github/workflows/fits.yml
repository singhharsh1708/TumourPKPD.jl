  merge:
    name: merge ${{ matrix.drug }} ${{ matrix.design }}
    permissions:
      contents: read
      actions: read   # resume mode: read run metadata / download artifacts of an earlier run
    needs: [prep, sample]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.sample.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix_merge) }}
    env:
      STAGE_KEY: ${{ secrets.STAGE_KEY }}
      DRUG: ${{ matrix.drug }}
      DESIGN: ${{ matrix.design }}
      NCHAINS: ${{ needs.prep.outputs.nchains }}
      PARTS: ${{ needs.prep.outputs.parts }}
      SUFFIX: ${{ needs.prep.outputs.suffix }}
      MODEL: ${{ needs.prep.outputs.model }}
      WANING: ${{ needs.prep.outputs.waning }}
      RESUME: ${{ needs.prep.outputs.resume }}
      MERGE_WITH: ${{ needs.prep.outputs.merge_with_run }}
      WARM_RUN: ${{ needs.prep.outputs.warm_run }}
    steps:
      - name: Require STAGE_KEY
        run: |
          if [ -z "$STAGE_KEY" ]; then
            echo "::error::repository secret STAGE_KEY is not set. Create it with: openssl rand -base64 48 | gh secret set STAGE_KEY"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download encrypted init state
        if: needs.prep.outputs.resume != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: init-${{ matrix.drug }}-${{ matrix.design }}
          path: stage/${{ matrix.drug }}_${{ matrix.design }}

