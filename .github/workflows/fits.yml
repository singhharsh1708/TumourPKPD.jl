  sample:
    name: sample ${{ matrix.drug }} ${{ matrix.design }} c${{ matrix.chain }} p${{ matrix.part }}
    permissions:
      contents: read
      actions: read   # resume mode: read run metadata / download artifacts of an earlier run
    # GitHub cannot depend on single matrix elements, so this waits for every warmup (and warmup2, which is skipped
    # when the warmup has fewer segments) job. The warm state comes from whichever job produced the artifact warm-...-K.
    # Combinations whose warmup failed fail fast on the artifact download below.
