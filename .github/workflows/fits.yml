        if: needs.prep.outputs.resume != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: warm-${{ matrix.drug }}-${{ matrix.design }}-*
          path: stage/${{ matrix.drug }}_${{ matrix.design }}
          merge-multiple: true

      - name: Download encrypted init state (earlier run)
        if: needs.prep.outputs.resume == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: init-${{ matrix.drug }}-${{ matrix.design }}
          path: stage/${{ matrix.drug }}_${{ matrix.design }}
          run-id: ${{ needs.prep.outputs.warm_run }}
          github-token: ${{ github.token }}

      - name: Download encrypted warmup states (earlier run)
        if: needs.prep.outputs.resume == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: warm-${{ matrix.drug }}-${{ matrix.design }}-*
          path: stage/${{ matrix.drug }}_${{ matrix.design }}
          merge-multiple: true
          run-id: ${{ needs.prep.outputs.warm_run }}
          github-token: ${{ github.token }}

      - name: Download encrypted chain parts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: chain-${{ matrix.drug }}-${{ matrix.design }}-*
          path: stage/${{ matrix.drug }}_${{ matrix.design }}
          merge-multiple: true

      - name: Decrypt stage files
        run: |
          for f in "stage/${DRUG}_${DESIGN}"/*.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$f" -out "${f%.enc}"
            rm "$f"
          done

      # Never merge a partial set: R-hat and ESS would silently be computed on fewer chains than requested.
      - name: Check that every chain and part is present
        run: |
          DIR="stage/${DRUG}_${DESIGN}"
          nw=$(find "$DIR" -maxdepth 1 -name 'warm_*.jld2' | wc -l)
          nc=$(find "$DIR" -maxdepth 1 -name 'chain_*_*.jld2' | wc -l)
          want=$((NCHAINS * PARTS))
          [ -f "$DIR/init.jld2" ] || { echo "init.jld2 missing"; exit 1; }
          if [ "$RESUME" = "true" ]; then
            # the earlier run may have had more chains than this one: this run needs warm_K for K = 1..NCHAINS
            for K in $(seq 1 "$NCHAINS"); do
              [ -f "$DIR/warm_${K}.jld2" ] || { echo "warm_${K}.jld2 missing from run ${WARM_RUN}"; exit 1; }
            done
          else
            [ "$nw" -eq "$NCHAINS" ] || { echo "found $nw warm files, expected $NCHAINS"; exit 1; }
          fi
          [ "$nc" -eq "$want" ] || { echo "found $nc chain parts, expected $want"; exit 1; }

      # merge_with_run: add the chain parts of the earlier run (chains K <= NCHAINS only). Encrypted files are downloaded into
      # their own directory first, so a part with the same (K,P) name as one of this run is an error instead of an overwrite.
      - name: Download encrypted chain parts of the earlier run
        if: needs.prep.outputs.resume == 'true' && needs.prep.outputs.merge_with_run == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: chain-${{ matrix.drug }}-${{ matrix.design }}-*
          path: stage-old/${{ matrix.drug }}_${{ matrix.design }}
          merge-multiple: true
          run-id: ${{ needs.prep.outputs.warm_run }}
          github-token: ${{ github.token }}

      - name: Add the earlier run's chain parts
        if: needs.prep.outputs.resume == 'true' && needs.prep.outputs.merge_with_run == 'true'
        run: |
          DIR="stage/${DRUG}_${DESIGN}"; OLD="stage-old/${DRUG}_${DESIGN}"
          added=0
          for f in "$OLD"/chain_*_*.jld2.enc; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .enc)
            K=$(echo "$b" | sed -E 's/^chain_([0-9]+)_[0-9]+\.jld2$/\1/')
            [ "$K" -le "$NCHAINS" ] || continue
            [ -e "$DIR/$b" ] && { echo "::error::$b exists in both runs: use a seed_offset >= the parts of run ${WARM_RUN}"; exit 1; }
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$f" -out "$DIR/$b"
            added=$((added + 1))
          done
          [ "$added" -gt 0 ] || { echo "::error::no chain parts of chains 1..${NCHAINS} found in run ${WARM_RUN}"; exit 1; }
          echo "added $added chain parts from run ${WARM_RUN}"

      - name: Download encrypted PDXE tables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdxe-data
          path: ${{ runner.temp }}/pdxe-data

      - name: Decrypt PDXE tables
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$RUNNER_TEMP/pdxe-data/data-cache.tgz.enc" | tar -xz -C data
          ls -l data/cache/pct_long.csv data/cache/pct_metrics.csv

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1.10'

      - name: Restore Julia depot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: ${{ needs.prep.outputs.depot_key }}

      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Merge
        run: |
          mkdir -p fits
          julia --project=. -t 4 scripts/fit_stage.jl merge "$DRUG" "$DESIGN" --dir="stage/${DRUG}_${DESIGN}" --out=fits/ \
            --expect-model="$MODEL" --expect-waning="$WANING"

      # The merged fit is the only thing uploaded in clear. The check verifies its structure (field allow-list,
      # no baseline coordinates or raw chain arrays, no constant baselines) as well as sizes and data column names.
      - name: Check upload
        run: julia --project=. scripts/ci_check_upload.jl --kind=fit --max-mb=500 "fits/${DRUG}_${DESIGN}${SUFFIX}.jld2" "fits/${DRUG}_${DESIGN}${SUFFIX}_diagnostics.md"

      - name: Diagnostics in job summary
        run: cat "fits/${DRUG}_${DESIGN}${SUFFIX}_diagnostics.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged fit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fit-${{ matrix.drug }}-${{ matrix.design }}${{ needs.prep.outputs.suffix }}
          path: |
            fits/${{ matrix.drug }}_${{ matrix.design }}${{ needs.prep.outputs.suffix }}.jld2
            fits/${{ matrix.drug }}_${{ matrix.design }}${{ needs.prep.outputs.suffix }}_diagnostics.md
          if-no-files-found: error
          retention-days: 90
          overwrite: true
