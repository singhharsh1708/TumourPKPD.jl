name: fits

# Staged hierarchical fits on standard runners. See docs/running_fits.md.
#
#   prep -> init -> warmup (per chain) -> sample (per chain and part) -> merge
#
# Data and secrets handling:
#   * No PDXE data in actions/cache (fork pull requests can restore caches). Only the Julia depot (code) is cached.
#   * `prep` downloads PDXE from the original source (checksum-verified, with retry), cleans it, and hands the cleaned
#     tables to the other jobs as an artifact encrypted with the repository secret STAGE_KEY (AES-256-CBC, PBKDF2,
#     salted). Every job decrypts it itself and fails if the secret is missing.
#   * The init, warm and chain stage artifacts are encrypted the same way: together they allow reconstructing observed
#     baselines. Only the merged fit (posterior draws and diagnostics) is uploaded in clear, after
#     scripts/ci_check_upload.jl has checked its structure.
#   * No reports or figures are uploaded; they are made locally.
#   * Every action is pinned to a full commit SHA.
#
# Resume mode (input warm_from_run): sample more draws from the init and warm artifacts of an earlier run. prep still runs (it
# rebuilds the data), init and warmup* are skipped, sample downloads init-* and warm-* from that run (needs `actions: read`),
# then merge. With merge_with_run=true merge also adds that run's chain-* artifacts (same fingerprint, distinct seeds).

run-name: fits ${{ inputs.drugs }} / ${{ inputs.designs }}

on:
  workflow_dispatch:
    inputs:
      drugs:
        description: Comma-separated drugs (names in data/regimens.toml)
        default: binimetinib,BKM120,BYL719
      designs:
        description: Comma-separated designs (primary, late21)
        default: primary,late21
      nchains:
        description: Chains per drug and design
        default: '4'
      nadapt:
        description: Warmup iterations per chain
        default: '500'
      parts:
        description: Sampling parts per chain (one job each)
        default: '2'
      draws_per_part:
        description: Draws per part, so draws per chain = parts x draws_per_part
        default: '250'
      seglen:
        description: Warmup segment length in iterations (0 = one warmup job; otherwise ceil(nadapt / seglen) chained jobs per chain, at most 4, so nadapt <= 4 x seglen)
        default: '125'
      burnin:
        description: Discarded iterations at the start of each sampling part (no adaptation)
        default: '25'
      units:
        description: Optional, subsample to N PDX units per drug (smoke tests only; leave empty for real fits)
        default: ''
      model:
        description: Model version, v1 (independent effects, pooled transition volume) or v2 (correlated log lambda0/log k2, per-PDX transition volume); v2 fits are saved as <drug>_<design>_v2
        default: v1
      waning:
        description: Pooled waning efficacy k2 exp(-rho t), true or false (sensitivity fit; saved with a _waning suffix)
        default: 'false'
      metric:
        description: Warmup mass matrix, diag (default) or block (dense population block + dense 5x5 block per PDX; about half the leapfrog steps)
        type: choice
        options: [diag, block]
        default: diag
      warm_from_run:
        description: Resume mode, id of an earlier run (digits) whose init-* and warm-* artifacts are reused; init and warmup are skipped. model and waning must match that run
        default: ''
      seed_offset:
        description: Sampling parts of this run are numbered seed_offset+1 .. seed_offset+parts, which changes their seeds. Use a value >= the parts of the run being extended
        default: '0'
      merge_with_run:
        description: Resume mode only, true also merges the chain-* parts of warm_from_run (same draws_per_part as that run required; needs seed_offset > 0)
        default: 'false'

# One run at a time per ref and drug/design selection. A second identical dispatch waits (it replaces any older
# waiting one) instead of running in parallel; a running fit is never cancelled.
concurrency:
  group: fits-${{ github.ref }}-${{ inputs.drugs }}-${{ inputs.designs }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  METRIC: ${{ inputs.metric }}

defaults:
  run:
    shell: bash

jobs:
  prep:
    name: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # resume mode: read run metadata / download artifacts of an earlier run
    timeout-minutes: 60
    env:
      STAGE_KEY: ${{ secrets.STAGE_KEY }}
    outputs:
      matrix_init: ${{ steps.matrix.outputs.matrix_init }}
      matrix_warmup: ${{ steps.matrix.outputs.matrix_warmup }}
      matrix_sample: ${{ steps.matrix.outputs.matrix_sample }}
      matrix_merge: ${{ steps.matrix.outputs.matrix_merge }}
      nchains: ${{ steps.matrix.outputs.nchains }}
      parts: ${{ steps.matrix.outputs.parts }}
      nadapt: ${{ steps.matrix.outputs.nadapt }}
      draws: ${{ steps.matrix.outputs.draws }}
      seglen: ${{ steps.matrix.outputs.seglen }}
      segmented: ${{ steps.matrix.outputs.segmented }}
      nseg: ${{ steps.matrix.outputs.nseg }}
      burnin: ${{ steps.matrix.outputs.burnin }}
      units: ${{ steps.matrix.outputs.units }}
      model: ${{ steps.matrix.outputs.model }}
      waning: ${{ steps.matrix.outputs.waning }}
      suffix: ${{ steps.matrix.outputs.suffix }}
      resume: ${{ steps.matrix.outputs.resume }}
      warm_run: ${{ steps.matrix.outputs.warm_run }}
      seed_offset: ${{ steps.matrix.outputs.seed_offset }}
      merge_with_run: ${{ steps.matrix.outputs.merge_with_run }}
      depot_key: ${{ steps.keys.outputs.depot }}
    steps:
      - name: Require STAGE_KEY
        run: |
          if [ -z "$STAGE_KEY" ]; then
            echo "::error::repository secret STAGE_KEY is not set. Create it with: openssl rand -base64 48 | gh secret set STAGE_KEY"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Julia
        id: julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1.10'

      # Validates the inputs (they end up in artifact names and shell commands) and builds the matrices.
      - name: Build matrices
        id: matrix
        env:
          IN_DRUGS: ${{ inputs.drugs }}
          IN_DESIGNS: ${{ inputs.designs }}
          IN_NCHAINS: ${{ inputs.nchains }}
          IN_NADAPT: ${{ inputs.nadapt }}
          IN_PARTS: ${{ inputs.parts }}
          IN_DRAWS: ${{ inputs.draws_per_part }}
          IN_SEGLEN: ${{ inputs.seglen }}
          IN_BURNIN: ${{ inputs.burnin }}
          IN_UNITS: ${{ inputs.units }}
          IN_MODEL: ${{ inputs.model }}
          IN_WANING: ${{ inputs.waning }}
          IN_WARM_FROM_RUN: ${{ inputs.warm_from_run }}
          IN_SEED_OFFSET: ${{ inputs.seed_offset }}
          IN_MERGE_WITH_RUN: ${{ inputs.merge_with_run }}
        run: julia scripts/ci_matrix.jl

      # Resume mode: the earlier run must be a manual dispatch of this fits workflow in this repository, never a fork or
      # pull-request run (fork PR runs live in the base repository too, and download-artifact does not check origin).
      - name: Verify resume source run
        if: ${{ steps.matrix.outputs.resume == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WARM_RUN: ${{ steps.matrix.outputs.warm_run }}
        run: |
          meta=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WARM_RUN}" --jq '[.head_repository.full_name, .path, .event, .head_branch] | @tsv')
          IFS=$'\t' read -r repo path event branch <<< "$meta"
          echo "resume source run ${WARM_RUN}: repo=${repo} path=${path} event=${event} branch=${branch}"
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::resume run is from ${repo}, not ${GITHUB_REPOSITORY}"; exit 1; }
          [ "$path" = ".github/workflows/fits.yml" ] || { echo "::error::resume run is not a fits.yml run (${path})"; exit 1; }
          [ "$event" = "workflow_dispatch" ] || { echo "::error::resume run event is ${event}, not workflow_dispatch"; exit 1; }

      - name: Cache key
        id: keys
        env:
          JULIA_VERSION: ${{ steps.julia.outputs.julia-version }}
          RUNNER_OS_NAME: ${{ runner.os }}
          PROJECT_HASH: ${{ hashFiles('Project.toml', 'Manifest.toml') }}
        run: echo "depot=julia-depot-v1-${RUNNER_OS_NAME}-${JULIA_VERSION}-${PROJECT_HASH}" >> "$GITHUB_OUTPUT"

      # The depot (code only) is saved only here. Matrix jobs restore it read-only, so a 50-job run does not write 50
      # caches into the 10 GB per-repository cache quota.
      - name: Restore Julia depot
        id: depot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: ${{ steps.keys.outputs.depot }}

      - name: Instantiate and precompile
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Save Julia depot
        if: steps.depot.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: ${{ steps.keys.outputs.depot }}

      - name: Download PDXE from the source (sha256 verified, with retry) and clean
        run: |
          export TUMOURPKPD_RAW_DIR="$RUNNER_TEMP/pdxe-raw"
          julia scripts/ci_fetch_pdxe.jl
          julia --project data/clean.jl
          ls -l data/cache/pct_long.csv data/cache/pct_metrics.csv

      # Plaintext tables never go into an artifact: tar is piped straight into openssl.
      - name: Encrypt cleaned tables
        run: |
          mkdir -p "$RUNNER_TEMP/pdxe-data"
          tar -C data -cz cache | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STAGE_KEY -out "$RUNNER_TEMP/pdxe-data/data-cache.tgz.enc"

      - name: Check upload
        run: julia scripts/ci_check_upload.jl --kind=stage --max-mb=100 "$RUNNER_TEMP/pdxe-data/data-cache.tgz.enc"

      # Two days rather than one: the sample waves queue behind the 20-job concurrency limit and can start a day after prep.
      - name: Upload encrypted cleaned tables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdxe-data
          path: ${{ runner.temp }}/pdxe-data/data-cache.tgz.enc
          if-no-files-found: error
          retention-days: 2
          overwrite: true

      - name: Plan
        env:
          IN_DRUGS: ${{ inputs.drugs }}
          IN_DESIGNS: ${{ inputs.designs }}
          NCHAINS: ${{ steps.matrix.outputs.nchains }}
          PARTS: ${{ steps.matrix.outputs.parts }}
          NADAPT: ${{ steps.matrix.outputs.nadapt }}
          DRAWS: ${{ steps.matrix.outputs.draws }}
          SEGMENTED: ${{ steps.matrix.outputs.segmented }}
          NSEG: ${{ steps.matrix.outputs.nseg }}
          SEGLEN: ${{ steps.matrix.outputs.seglen }}
          BURNIN: ${{ steps.matrix.outputs.burnin }}
          UNITS: ${{ steps.matrix.outputs.units }}
          RESUME: ${{ steps.matrix.outputs.resume }}
          WARM_RUN: ${{ steps.matrix.outputs.warm_run }}
          SEED_OFFSET: ${{ steps.matrix.outputs.seed_offset }}
          MERGE_WITH: ${{ steps.matrix.outputs.merge_with_run }}
        run: |
          {
            echo "### Fit plan"
            echo
            echo "- drugs: ${IN_DRUGS}"
            echo "- designs: ${IN_DESIGNS}"
            echo "- chains: ${NCHAINS}, parts per chain: ${PARTS}, nadapt: ${NADAPT}, draws per part: ${DRAWS}, burn-in per part: ${BURNIN}"
            if [ "$SEGMENTED" = "true" ]; then echo "- warmup: ${NSEG} chained jobs per chain (segments of ${SEGLEN} iterations)"; else echo "- warmup: one job per chain"; fi
            echo "- unit subsample: ${UNITS:-none (full data)}"
            if [ "$RESUME" = "true" ]; then
              echo "- **resume**: init and warmup reused from run ${WARM_RUN}; sampling parts numbered $((SEED_OFFSET + 1)) to $((SEED_OFFSET + PARTS)); merge with that run's chain parts: ${MERGE_WITH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  init:
    name: init ${{ matrix.drug }} ${{ matrix.design }}
    needs: prep
    if: ${{ needs.prep.outputs.resume != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix_init) }}
    env:
      STAGE_KEY: ${{ secrets.STAGE_KEY }}
      DRUG: ${{ matrix.drug }}
      DESIGN: ${{ matrix.design }}
    steps:
      - name: Require STAGE_KEY
        run: |
          if [ -z "$STAGE_KEY" ]; then
            echo "::error::repository secret STAGE_KEY is not set. Create it with: openssl rand -base64 48 | gh secret set STAGE_KEY"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download encrypted PDXE tables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdxe-data
          path: ${{ runner.temp }}/pdxe-data

      - name: Decrypt PDXE tables
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$RUNNER_TEMP/pdxe-data/data-cache.tgz.enc" | tar -xz -C data
          ls -l data/cache/pct_long.csv data/cache/pct_metrics.csv

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1.10'

      - name: Restore Julia depot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: ${{ needs.prep.outputs.depot_key }}

      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Init
        env:
          UNITS: ${{ needs.prep.outputs.units }}
          MODEL: ${{ needs.prep.outputs.model }}
          WANING: ${{ needs.prep.outputs.waning }}
        run: |
          DIR="stage/${DRUG}_${DESIGN}"
          mkdir -p "$DIR"
          extra=("--model=$MODEL")
          if [ "$WANING" = "true" ]; then extra+=("--waning"); fi
          if [ -n "$UNITS" ]; then extra+=("--units=$UNITS"); fi
          julia --project=. -t 4 scripts/fit_stage.jl init "$DRUG" "$DESIGN" --out="$DIR" "${extra[@]}"

      - name: Encrypt init state
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STAGE_KEY -in "stage/${DRUG}_${DESIGN}/init.jld2" -out "stage/${DRUG}_${DESIGN}/init.jld2.enc"

      - name: Check upload
        run: julia scripts/ci_check_upload.jl --kind=stage --max-mb=50 "stage/${DRUG}_${DESIGN}/init.jld2.enc"

      - name: Upload encrypted init state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: init-${{ matrix.drug }}-${{ matrix.design }}
          path: stage/${{ matrix.drug }}_${{ matrix.design }}/init.jld2.enc
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  warmup:
    name: warmup ${{ matrix.drug }} ${{ matrix.design }} c${{ matrix.chain }}
    # Run for every combination whose init job ran, so one failed drug does not block the others.
    # A combination whose init failed fails fast on the artifact download below.
    needs: [prep, init]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.init.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix_warmup) }}
    env:
      STAGE_KEY: ${{ secrets.STAGE_KEY }}
      DRUG: ${{ matrix.drug }}
      DESIGN: ${{ matrix.design }}
      CHAIN: ${{ matrix.chain }}
      NADAPT: ${{ needs.prep.outputs.nadapt }}
      SEGMENTED: ${{ needs.prep.outputs.segmented }}
      SEGLEN: ${{ needs.prep.outputs.seglen }}
    steps:
      - name: Require STAGE_KEY
        run: |
          if [ -z "$STAGE_KEY" ]; then
            echo "::error::repository secret STAGE_KEY is not set. Create it with: openssl rand -base64 48 | gh secret set STAGE_KEY"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download encrypted init state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: init-${{ matrix.drug }}-${{ matrix.design }}
          path: stage/${{ matrix.drug }}_${{ matrix.design }}

      - name: Decrypt stage files
        run: |
          for f in "stage/${DRUG}_${DESIGN}"/*.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$f" -out "${f%.enc}"
            rm "$f"
          done

      - name: Download encrypted PDXE tables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdxe-data
          path: ${{ runner.temp }}/pdxe-data

      - name: Decrypt PDXE tables
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$RUNNER_TEMP/pdxe-data/data-cache.tgz.enc" | tar -xz -C data
          ls -l data/cache/pct_long.csv data/cache/pct_metrics.csv

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1.10'

      - name: Restore Julia depot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: ${{ needs.prep.outputs.depot_key }}

      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      # Segmented: segment 1 of nseg (iterations 1..seglen), writes the resumable state warmup_K_1. Otherwise (seglen 0, or
      # seglen >= nadapt) one job does the whole warmup and writes warm_K.
      - name: Warmup
        run: |
          DIR="stage/${DRUG}_${DESIGN}"
          if [ "$SEGMENTED" = "true" ]; then
            julia --project=. -t 4 scripts/fit_stage.jl warmup "$DRUG" "$DESIGN" \
              --chain="$CHAIN" --dir="$DIR" --nadapt="$NADAPT" --seglen="$SEGLEN" --seg=1 --metric="$METRIC"
            echo "WARM_FILE=warmup_${CHAIN}_1.jld2" >> "$GITHUB_ENV"
          else
            julia --project=. -t 4 scripts/fit_stage.jl warmup "$DRUG" "$DESIGN" \
              --chain="$CHAIN" --dir="$DIR" --nadapt="$NADAPT" --metric="$METRIC"
            echo "WARM_FILE=warm_${CHAIN}.jld2" >> "$GITHUB_ENV"
          fi

      - name: Encrypt warmup state
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STAGE_KEY -in "stage/${DRUG}_${DESIGN}/${WARM_FILE}" -out "stage/${DRUG}_${DESIGN}/${WARM_FILE}.enc"

      - name: Check upload
        run: julia scripts/ci_check_upload.jl --kind=stage --max-mb=50 "stage/${DRUG}_${DESIGN}/${WARM_FILE}.enc"

      - name: Upload encrypted warmup state (complete, no segments)
        if: env.SEGMENTED != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warm-${{ matrix.drug }}-${{ matrix.design }}-${{ matrix.chain }}
          path: stage/${{ matrix.drug }}_${{ matrix.design }}/${{ env.WARM_FILE }}.enc
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload encrypted warmup segment 1
        if: env.SEGMENTED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warmseg-${{ matrix.drug }}-${{ matrix.design }}-${{ matrix.chain }}-1
          path: stage/${{ matrix.drug }}_${{ matrix.design }}/${{ env.WARM_FILE }}.enc
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  warmup2:
    name: warmup2 ${{ matrix.drug }} ${{ matrix.design }} c${{ matrix.chain }}
    # Segment 2 of NSEG (2 = 2..4; segment 1 is the `warmup` job). Runs only when the warmup has at least 2 segments
    # (seglen > 0, nseg = ceil(nadapt / seglen) <= 4). Needs the whole previous matrix (no per-element dependency); a chain
    # whose previous segment failed fails fast on the download below. The segment that reaches nadapt writes the final
    # warm_K state (artifact warm-...-K); earlier ones write the resumable warmup_K_S state (artifact warmseg-...-K-2).
    needs: [prep, warmup]
    if: ${{ !cancelled() && needs.prep.result == 'success' && fromJSON(needs.prep.outputs.nseg) >= 2 && needs.warmup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix_warmup) }}
    env:
      STAGE_KEY: ${{ secrets.STAGE_KEY }}
      DRUG: ${{ matrix.drug }}
      DESIGN: ${{ matrix.design }}
      CHAIN: ${{ matrix.chain }}
      NADAPT: ${{ needs.prep.outputs.nadapt }}
      NSEG: ${{ needs.prep.outputs.nseg }}
      SEGLEN: ${{ needs.prep.outputs.seglen }}
      SEG: '2'
    steps:
      - name: Require STAGE_KEY
        run: |
          if [ -z "$STAGE_KEY" ]; then
            echo "::error::repository secret STAGE_KEY is not set. Create it with: openssl rand -base64 48 | gh secret set STAGE_KEY"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download encrypted init state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: init-${{ matrix.drug }}-${{ matrix.design }}
          path: stage/${{ matrix.drug }}_${{ matrix.design }}

      - name: Download encrypted warmup segment 1 of this chain
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: warmseg-${{ matrix.drug }}-${{ matrix.design }}-${{ matrix.chain }}-1
          path: stage/${{ matrix.drug }}_${{ matrix.design }}

      - name: Decrypt stage files
        run: |
          for f in "stage/${DRUG}_${DESIGN}"/*.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$f" -out "${f%.enc}"
            rm "$f"
          done

      - name: Download encrypted PDXE tables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pdxe-data
          path: ${{ runner.temp }}/pdxe-data

      - name: Decrypt PDXE tables
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STAGE_KEY -in "$RUNNER_TEMP/pdxe-data/data-cache.tgz.enc" | tar -xz -C data
          ls -l data/cache/pct_long.csv data/cache/pct_metrics.csv

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1.10'

      - name: Restore Julia depot
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: ${{ needs.prep.outputs.depot_key }}

      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Warmup segment 2
        run: |
          julia --project=. -t 4 scripts/fit_stage.jl warmup "$DRUG" "$DESIGN" \
